# Create this Blueprint in your own Render account after the code is on GitHub.
# Review the paid web-service and persistent-disk charges before deploying.
services:
  - type: web
    name: mtm-support-bookings
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    branch: main
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: mtm-bookings-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'false'
      - key: DATABASE_PATH
        value: /var/data/mtm.sqlite
      # The server uses Render's RENDER_EXTERNAL_URL as its HTTPS origin.
      # PUBLIC_ORIGIN is only needed when changing to a custom domain.
      - key: MTM_SETUP_SECRET
        generateValue: true
      - key: RSVP_WEBHOOK_SECRET
        generateValue: true
      - key: AIRTABLE_PAT
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false
      - key: AIRTABLE_PARTICIPANTS_TABLE
        sync: false
      - key: AIRTABLE_EVENTS_TABLE
        value: Events
      - key: AIRTABLE_RSVPS_TABLE
        value: RSVPs
      - key: AIRTABLE_SHIFTS_TABLE
        value: Shift Requests
      - key: AIRTABLE_SYNC_ENABLED
        value: 'false'
      - key: AIRTABLE_FIELD_MAP
        value: >-
          {
            "participants": {
              "name": "Full Name",
              "supportType": "1:1 Support"
            },
            "shifts": {
              "portalId": "Portal request ID",
              "participant": "Participant",
              "start": "Requested Start",
              "end": "Requested End",
              "description": "Request Notes",
              "location": "Location",
              "driving": "Driving preference",
              "gender": "Worker Gender Preference",
              "notes": "Portal notes",
              "kind": "Support Type",
              "status": "Request Status",
              "source": "Request Source",
              "event": "Event",
              "staffName": null,
              "staff": "Assigned Staff",
              "pendingChange": "Pending change",
              "updatedAt": "Portal updated at"
            },
            "events": {
              "name": "Name",
              "start": "Start",
              "end": "End",
              "location": "Address",
              "description": null,
              "status": "Stage"
            },
            "rsvps": {
              "participant": "Participant",
              "event": "Event",
              "status": "Circle RSVP",
              "cancelledAt": "Cancelled"
            }
          }
      - key: AIRTABLE_SHIFT_VALUE_MAP
        value: >-
          {
            "status": {
              "requested": "New",
              "confirmed": "Organised",
              "declined": "Declined",
              "cancelled": "Cancelled"
            },
            "kind": {
              "general": "General Support",
              "event": "Event Support"
            },
            "source": {
              "client": "Client Portal",
              "staff": "Office",
              "event": "Circle RSVP"
            }
          }
      - key: AIRTABLE_SUPPORT_TYPE_MAP
        value: '{"Recommended":"none"}'
      - key: AIRTABLE_RSVP_STATUS_MAP
        value: '{"Active":"attending","Dropped":"cancelled"}'
